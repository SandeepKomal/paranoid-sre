name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Skill frontmatter and links
        run: python3 scripts/check.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
      - name: Plugin and marketplace manifests
        run: |
          # npm ci installs exactly what package-lock.json records, hashes included.
          npm ci --prefix .github/tools --no-audit --no-fund
          .github/tools/node_modules/.bin/claude plugin validate . --strict

  secrets:
    # Scan every commit for committed keys, tokens and passwords.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.21.2 git . --no-banner --redact --verbose

  fuzz:
    # Fuzz the skill checker's parsers with Atheris, seeded from real files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Atheris (pinned by hash)
        run: python -m pip install --require-hashes --only-binary ":all:" -r fuzz/requirements.txt
      - name: Fuzz for 60 seconds
        run: |
          cp -r fuzz/corpus "$RUNNER_TEMP/corpus"
          python fuzz/fuzz_check.py -max_total_time=60 "$RUNNER_TEMP/corpus"
