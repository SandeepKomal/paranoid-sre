# Dependabot version updates.
# The project has no package manifests; the only versioned dependencies are the
# GitHub Actions used by the workflows in .github/workflows/.
# Options: see "Configuration options for the dependabot.yml file" in GitHub's documentation.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/.github/tools"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
